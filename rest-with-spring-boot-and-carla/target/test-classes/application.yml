server:
  port: 8888

cors:
  originPatterns: http://www.localhost:8080,https://www.spring.io,http://www.localhost:3000,https://www.erudio.com.br

spring:
  application:
    name: rest-with-spring-boot-and-carla
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false

    open-in-view:
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true